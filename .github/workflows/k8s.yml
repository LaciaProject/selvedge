name: kubernetes

# Multi-node high-availability tests on kind: three workers in three zones, the
# ha profile, rolling restarts and runner crashes under load. Heavier than ci.yml,
# so it runs on `ci/*` branches, on main, and on demand.
on:
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:
  # The workerd update workflow tests its branch with this one.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: k8s-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  kind-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: selvedge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          cluster_name: selvedge
          config: test/k8s/kind.yaml
      - uses: azure/setup-helm@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        run: cd test/e2e && npm install --no-audit --no-fund
      - name: Load the image and install Selvedge (ha profile)
        run: |
          kind load docker-image selvedge:ci --name selvedge
          helm install slv deploy/helm/selvedge --namespace selvedge --create-namespace \
            -f test/k8s/values.yaml --wait --timeout 10m
          kubectl -n selvedge get pods -o wide
      - name: High-availability tests
        run: test/k8s/e2e.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n selvedge get pods -o wide
          kubectl -n selvedge get events --sort-by=.lastTimestamp | tail -40
          for c in api data gateway runner; do
            echo "=== $c"; kubectl -n selvedge logs -l app.kubernetes.io/component=$c --tail=80 --all-containers --prefix || true
          done

  # Durable Object consistency under faults (RFC 0001, S1): Chaos Mesh crashes,
  # partitions, slows and skews the runners while clients append to Durable
  # Object logs, then the whole history is checked for linearizability.
  kind-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Kernel modules for network faults
        run: sudo modprobe -a sch_netem ip_set ip_set_hash_net ip_set_hash_ip xt_set
      # Every kind node shares the runner's kernel, and its default of 128
      # inotify instances per user runs out with Chaos Mesh's controllers on
      # top of the cluster; controllers that hit it crash.
      - name: Raise inotify limits
        run: sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: selvedge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          cluster_name: selvedge
          config: test/k8s/kind.yaml
      - uses: azure/setup-helm@v4
      - name: Install Chaos Mesh 2.7.2
        run: |
          helm install chaos-mesh chaos-mesh --repo https://charts.chaos-mesh.org --version 2.7.2 \
            --namespace chaos-mesh --create-namespace \
            --set chaosDaemon.runtime=containerd --set chaosDaemon.socketPath=/run/containerd/containerd.sock \
            --set 'chaosDaemon.tolerations[0].operator=Exists' --set dashboard.create=false \
            --wait --timeout 10m
          kubectl -n chaos-mesh get pods -o wide
      - name: Install Selvedge (ha profile, every runner serving the test account)
        run: |
          kind load docker-image selvedge:ci --name selvedge
          kubectl create namespace selvedge
          kubectl -n selvedge apply -f test/k8s/chaos/nodeports.yaml
          helm install slv deploy/helm/selvedge --namespace selvedge \
            -f test/k8s/values.yaml -f test/k8s/chaos/values.yaml --wait --timeout 10m
          kubectl -n selvedge get pods -o wide
      - name: Faults under load, then the consistency check
        run: CHAOS_OUT=chaos-out test/k8s/chaos.sh
      - name: Keep the history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-history
          path: chaos-out/
          if-no-files-found: ignore
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n selvedge get pods -o wide
          kubectl -n selvedge get networkchaos,timechaos,podchaos -o wide || true
          kubectl -n selvedge describe networkchaos,timechaos,podchaos | tail -60 || true
          kubectl -n selvedge get events --sort-by=.lastTimestamp | tail -40
          kubectl -n chaos-mesh logs -l app.kubernetes.io/component=chaos-daemon --tail=60 --prefix || true
          echo "=== chaos-mesh"; kubectl -n chaos-mesh get pods -o wide || true
          kubectl -n chaos-mesh get events --sort-by=.lastTimestamp | tail -30 || true
          for p in $(kubectl -n chaos-mesh get pods -l app.kubernetes.io/component=controller-manager -o name); do
            echo "=== $p"; kubectl -n chaos-mesh logs "$p" --tail=40 || true
            echo "=== $p (previous)"; kubectl -n chaos-mesh logs "$p" --previous --tail=40 || true
          done
          for c in gateway runner seaweedfs; do
            echo "=== $c"; kubectl -n selvedge logs -l app.kubernetes.io/component=$c --tail=150 --all-containers --prefix || true
          done

  # Upgrading from the last release: its published chart and image hold data
  # of every kind, then `helm upgrade` to this commit runs under load.
  kind-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
      - name: The release to upgrade from
        id: from
        run: |
          here=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          from=$(git tag --list 'v*' --merged HEAD --sort=-v:refname | grep -vx "${here:-none}" | head -1)
          [ -n "$from" ] || { echo "::error::no earlier release tag"; exit 1; }
          echo "version=${from#v}" >> "$GITHUB_OUTPUT"
          echo "upgrading from $from"
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: selvedge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          cluster_name: selvedge
          config: test/k8s/kind.yaml
      - uses: azure/setup-helm@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        run: cd test/e2e && npm install --no-audit --no-fund
      - name: Install the release (published chart and image)
        env:
          FROM: ${{ steps.from.outputs.version }}
        run: |
          kind load docker-image selvedge:ci --name selvedge
          helm install slv oci://ghcr.io/laciaproject/charts/selvedge --version "$FROM" \
            --namespace selvedge --create-namespace -f test/k8s/values.yaml \
            --set image.repository=ghcr.io/laciaproject/selvedge --set image.tag="$FROM" \
            --set image.pullPolicy=IfNotPresent --wait --timeout 10m
          kubectl -n selvedge get pods -o wide
      - name: Upgrade to this commit under load
        env:
          UPGRADE_FROM: ${{ steps.from.outputs.version }}
        run: test/k8s/upgrade.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n selvedge get pods -o wide
          kubectl -n selvedge get events --sort-by=.lastTimestamp | tail -40
          for c in api data gateway runner; do
            echo "=== $c"; kubectl -n selvedge logs -l app.kubernetes.io/component=$c --tail=120 --all-containers --prefix || true
          done

  # Containers (RFC 0002) on kind: instances are pods in Kata VMs, which needs
  # /dev/kvm (GitHub's Ubuntu runners have nested virtualization).
  kind-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo modprobe vhost_vsock && sudo modprobe vhost_net
          ls -l /dev/kvm /dev/vhost-vsock /dev/vhost-net
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: selvedge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          cluster_name: selvedge
          config: test/k8s/containers/kind.yaml
          # The node is ready only once Calico runs.
          wait: 0s
      - name: Install Calico
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico.yaml > /dev/null
          # kind nodes have loose reverse-path filtering, which Felix refuses by default.
          kubectl -n kube-system set env daemonset/calico-node FELIX_IGNORELOOSERPF=true
          kubectl -n kube-system rollout status ds/calico-node --timeout=5m
          kubectl wait --for=condition=Ready nodes --all --timeout=5m
      - uses: azure/setup-helm@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        run: cd test/e2e && npm install --no-audit --no-fund
      - name: Install Kata (kata-deploy 4.3.1)
        run: |
          helm install kata-deploy oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
            --version 4.3.1 --namespace kube-system --wait --timeout 15m
          for _ in $(seq 1 90); do kubectl get runtimeclass kata-qemu > /dev/null 2>&1 && break; sleep 5; done
          kubectl get runtimeclass
      - name: Let the node pull from the test registry over HTTP
        run: |
          docker exec selvedge-control-plane sh -c 'mkdir -p "/etc/containerd/certs.d/localhost:30500" &&
            printf "server = \"http://localhost:30500\"\n\n[host.\"http://localhost:30500\"]\n  capabilities = [\"pull\", \"resolve\"]\n" \
            > "/etc/containerd/certs.d/localhost:30500/hosts.toml"'
      - name: Install Selvedge with containers
        run: |
          kind load docker-image selvedge:ci --name selvedge
          kubectl create namespace selvedge
          kubectl -n selvedge apply -f test/k8s/containers/api-nodeport.yaml
          helm install slv deploy/helm/selvedge --namespace selvedge \
            -f test/k8s/containers/values.yaml --wait --timeout 10m
          kubectl -n selvedge get pods -o wide
      - name: Containers tests
        run: test/k8s/containers.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n selvedge get pods -o wide
          kubectl -n selvedge get events --sort-by=.lastTimestamp | tail -60
          kubectl -n selvedge describe pods -l selvedge.dev/component=container | tail -80 || true
          for p in $(kubectl -n selvedge get pods -l selvedge.dev/component=container -o name); do
            echo "=== processes in $p"; kubectl -n selvedge exec "$p" -c app -- ps -o pid,stat,args || true
          done
          kubectl -n selvedge get networkpolicy -o yaml | grep -A40 'name: slv-container-instances' | head -60 || true
          for c in api containers runner registry; do
            echo "=== $c"; kubectl -n selvedge logs -l app.kubernetes.io/component=$c --tail=300 --all-containers --prefix | grep -v healthz || true
          done
          docker exec selvedge-control-plane sh -c 'journalctl --no-pager -u containerd -n 200 | grep -iE "error|fail|pull" | tail -60' || true
