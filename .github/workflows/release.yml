# Publishes a release when a version tag (v0.1.0, ...) is pushed: the image
# (linux/amd64 and linux/arm64) and the Helm chart (as an OCI artifact) to
# GHCR, then a GitHub release with the chart attached. The tag must match the
# chart's version and appVersion.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      # Registry paths must be lowercase; the owner's name may not be.
      image: ${{ steps.v.outputs.image }}
      chart_repo: ${{ steps.v.outputs.chart_repo }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag matches the chart
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          chart=$(sed -n 's/^version: *//p' deploy/helm/selvedge/Chart.yaml)
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/selvedge/Chart.yaml)
          echo "tag $version, chart $chart, appVersion $app"
          [ "$version" = "$chart" ] && [ "$version" = "$app" ] || {
            echo "::error::tag v$version does not match Chart.yaml (version $chart, appVersion $app)"; exit 1; }
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "version=$version"
            echo "image=ghcr.io/$owner/selvedge"
            echo "chart_repo=oci://ghcr.io/$owner/charts"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: check
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.check.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: [check, image]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      CHART_REPO: ${{ needs.check.outputs.chart_repo }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        run: |
          set -eu
          helm lint deploy/helm/selvedge
          helm package deploy/helm/selvedge --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/selvedge-${{ needs.check.outputs.version }}.tgz" "$CHART_REPO"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          v="${{ needs.check.outputs.version }}"
          cat > notes.md <<EOF
          Image: \`$IMAGE:$v\` (linux/amd64, linux/arm64)

          Helm chart: \`helm install selvedge $CHART_REPO/selvedge --version $v\`

          See [docs/status.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/docs/status.md) for what works and its limits.
          EOF
          gh release create "$GITHUB_REF_NAME" "dist/selvedge-$v.tgz" --title "Selvedge $v" \
            --notes-file notes.md --generate-notes --verify-tag
