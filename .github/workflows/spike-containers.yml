name: containers spike

# RFC 0002 §9: does workerd's container backend (and its proxy-everything
# sidecar) work under each OCI runtime? Throwaway; runs on spike/containers pushes
# and by hand.
on:
  push:
    branches: ["spike/containers"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: [runc, runsc, runsc-netraw]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workerd
        run: |
          mkdir -p "$RUNNER_TEMP/w" && cd "$RUNNER_TEMP/w" && npm init -y > /dev/null
          npm install --no-audit --no-fund workerd@1.20261109.1 > /dev/null
          echo "SELVEDGE_WORKERD=$(readlink -f node_modules/@cloudflare/workerd-linux-64/bin/workerd)" >> "$GITHUB_ENV"
      - name: Install gVisor and make it Docker's default runtime
        if: matrix.runtime != 'runc'
        run: |
          # The release bucket's `latest` path is gone; GitHub releases carry
          # the binaries now. Pinned, with the release's checksum.
          cd "$RUNNER_TEMP"
          curl -fsSLo gvisor.tar.bz2 https://github.com/google/gvisor/releases/download/release-20261102.0/gvisor-x86_64.tar.bz2
          echo "6f6b1a8f0f4665a403238135167d0d990bfaeaff5544abf68f5e0d822b35484a  gvisor.tar.bz2" | sha256sum -c
          mkdir gvisor && tar -xjf gvisor.tar.bz2 -C gvisor
          sudo install -m 755 "$(find gvisor -type f -name runsc | head -1)" /usr/local/bin/runsc
          runsc --version
          if [ "${{ matrix.runtime }}" = runsc-netraw ]; then
            sudo runsc install --runtime runsc -- --net-raw
          else
            sudo runsc install --runtime runsc
          fi
          sudo python3 - <<'PY'
          import json
          p = "/etc/docker/daemon.json"
          d = json.load(open(p))
          d["default-runtime"] = "runsc"
          json.dump(d, open(p, "w"), indent=1)
          print(json.dumps(d))
          PY
          sudo systemctl restart docker
          docker info --format '{{.DefaultRuntime}}'
          docker run --rm alpine:3.20 dmesg | head -3
      - name: Run the spike
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          test/spike/containers/run.sh > "result-${{ matrix.runtime }}.json"
          cat "result-${{ matrix.runtime }}.json"
          python3 - "result-${{ matrix.runtime }}.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"### {r['runtime']}\n\n| Step | Seconds | Answer |\n| --- | ---: | --- |")
          for s in r["steps"]:
              a = s["answer"].replace("|", "\\|").replace("\n", " ")[:120]
              print(f"| {s['step']} | {s['seconds']} | {a} |")
          print("\nDocker API calls:\n")
          for c in r.get("docker_api", []):
              print(f"- `{c}`")
          print()
          PY
      - name: Probe the network stack
        if: always()
        run: |
          test/spike/containers/probe-netstack.sh | tee "netstack-${{ matrix.runtime }}.jsonl"
          python3 - "netstack-${{ matrix.runtime }}.jsonl" "${{ matrix.runtime }}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          print(f"### Network setup steps under {sys.argv[2]}\n")
          for line in open(sys.argv[1]):
              r = json.loads(line)
              if "step" in r:
                  print(f"- `{r['step']}`: exit {r['exit']} {r['out'][:100]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-${{ matrix.runtime }}
          path: |
            result-*.json
            netstack-*.jsonl

  # Kata cannot share a network namespace between containers under Docker
  # (each is its own VM), so it is tried where it can: one Kubernetes pod.
  kata-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Build the app image
        run: docker build -q -t selvedge-spike-app:1 test/spike/containers/app
      - uses: helm/kind-action@v1
        with:
          cluster_name: spike
          config: test/spike/containers/kata/kind.yaml
      - uses: azure/setup-helm@v4
      - name: Install Kata (kata-deploy 4.3.1)
        run: |
          kind load docker-image selvedge-spike-app:1 --name spike
          helm install kata-deploy oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
            --version 4.3.1 --namespace kube-system --wait --timeout 15m
          for _ in $(seq 1 90); do kubectl get runtimeclass kata-qemu > /dev/null 2>&1 && break; sleep 5; done
          kubectl get runtimeclass
          kubectl get nodes --show-labels | tr ',' '\n' | grep -i kata || true
      - name: Run the spike
        run: |
          test/spike/containers/kata/run.sh > result-kata.json; cat result-kata.json
          python3 - result-kata.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print("### Kata on kind\n")
          for k in ["pod_ready", "pod_start_seconds", "containers", "ingress_through_sidecar", "guest_kernel", "host_kernel"]:
              print(f"- {k}: `{r[k]}`")
          print("\n| Step | Exit | Output |\n| --- | --- | --- |")
          for s in r["probe"]:
              print(f"| {s['step']} | {s['exit']} | {s['out'][:100]} |")
          PY
      - name: Diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe pod box | tail -40 || true
          kubectl logs -n kube-system -l name=kata-deploy --tail=50 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-kata
          path: result-kata.json
