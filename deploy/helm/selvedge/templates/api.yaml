{{- $name := include "selvedge.name" . -}}
{{- $c := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  labels: {{- include "selvedge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ include "selvedge.replicas" $c }}
  selector:
    matchLabels: {{- include "selvedge.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "selvedge.selector" $c | nindent 8 }}
    spec:
      {{- include "selvedge.pod" $c | nindent 6 }}
      containers:
        - name: api
          image: {{ include "selvedge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [api]
          env:
            {{- include "selvedge.commonEnv" . | nindent 12 }}
            {{- include "selvedge.databaseEnv" . | nindent 12 }}
            {{- include "selvedge.s3Env" . | nindent 12 }}
            - name: SELVEDGE_API_LISTEN
              value: 0.0.0.0:8787
            - name: SELVEDGE_BLOB_URL
              value: s3://{{ .Values.objectStore.bucket }}/blobs
            - name: SELVEDGE_GATEWAY_URL
              value: {{ include "selvedge.gatewayInternalUrl" . }}
            {{- if .Values.tls.enabled }}
            - name: SELVEDGE_API_INTERNAL_LISTEN
              value: 0.0.0.0:8786
            {{- end }}
            {{- include "selvedge.tlsEnv" . | nindent 12 }}
            - name: SELVEDGE_WORKERS_DEV_ZONE
              value: {{ .Values.workersDevZone | quote }}
            - name: SELVEDGE_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "selvedge.secretName" . }}, key: master-key } }
            - name: SELVEDGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "selvedge.secretName" . }}, key: admin-token } }
          ports:
            - { name: http, containerPort: 8787 }
            {{- if .Values.tls.enabled }}
            - { name: internal, containerPort: 8786 }
            {{- end }}
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 6 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.tls.enabled }}
          volumeMounts: {{- include "selvedge.tlsMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.tls.enabled }}
      volumes: {{- include "selvedge.tlsVolume" . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
  labels: {{- include "selvedge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector: {{- include "selvedge.selector" $c | nindent 4 }}
  ports: [{ name: http, port: {{ .Values.api.service.port }}, targetPort: http }]
{{- if .Values.tls.enabled }}
---
# The API's internal endpoints, for agents and gateways (mTLS).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api-internal
  labels: {{- include "selvedge.labels" . | nindent 4 }}
spec:
  selector: {{- include "selvedge.selector" $c | nindent 4 }}
  ports: [{ name: internal, port: 8786, targetPort: internal }]
{{- end }}
