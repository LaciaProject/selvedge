{{- $name := include "selvedge.name" . -}}
{{- $c := dict "root" . "component" "data" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-data
  labels: {{- include "selvedge.labels" . | nindent 4 }}
    app.kubernetes.io/component: data
spec:
  replicas: {{ include "selvedge.replicas" $c }}
  selector:
    matchLabels: {{- include "selvedge.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "selvedge.selector" $c | nindent 8 }}
    spec:
      {{- include "selvedge.pod" $c | nindent 6 }}
      containers:
        - name: data
          image: {{ include "selvedge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [data]
          env:
            {{- include "selvedge.commonEnv" . | nindent 12 }}
            {{- include "selvedge.databaseEnv" . | nindent 12 }}
            {{- include "selvedge.s3Env" . | nindent 12 }}
            - name: SELVEDGE_DATA_LISTEN
              value: 0.0.0.0:8788
            - name: SELVEDGE_GATEWAY_URL
              value: {{ include "selvedge.gatewayInternalUrl" . }}
            {{- include "selvedge.tlsEnv" . | nindent 12 }}
            - name: SELVEDGE_BLOB_URL
              value: s3://{{ .Values.objectStore.bucket }}/blobs
            {{- if .Values.data.r2S3.enabled }}
            - name: SELVEDGE_R2_S3_LISTEN
              value: 0.0.0.0:8790
            {{- end }}
          ports:
            - { name: http, containerPort: 8788 }
            {{- if .Values.data.r2S3.enabled }}
            - { name: r2-s3, containerPort: 8790 }
            {{- end }}
          {{- include "selvedge.probes" (dict "root" . "port" 8788) | nindent 10 }}
          resources: {{- toYaml .Values.data.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.tls.enabled }}
          volumeMounts: {{- include "selvedge.tlsMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.tls.enabled }}
      volumes: {{- include "selvedge.tlsVolume" . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-data
  labels: {{- include "selvedge.labels" . | nindent 4 }}
spec:
  selector: {{- include "selvedge.selector" $c | nindent 4 }}
  ports: [{ name: http, port: 8788, targetPort: http }]
{{- if .Values.data.r2S3.enabled }}
---
# R2's S3-compatible API. Expose it with an Ingress or a LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-r2-s3
  labels: {{- include "selvedge.labels" . | nindent 4 }}
  {{- with .Values.data.r2S3.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.data.r2S3.service.type }}
  selector: {{- include "selvedge.selector" $c | nindent 4 }}
  ports: [{ name: http, port: {{ .Values.data.r2S3.service.port }}, targetPort: r2-s3 }]
{{- end }}
