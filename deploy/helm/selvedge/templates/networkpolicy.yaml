{{- if .Values.networkPolicy.enabled }}
{{- $name := include "selvedge.name" . -}}
# Runners run tenant code. They may reach the platform services they need,
# other runners (workerd cluster ports), DNS, and public addresses only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-runner
  labels: {{- include "selvedge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "selvedge.selector" (dict "root" . "component" "runner") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{- include "selvedge.peer" (dict "root" . "component" "gateway") | nindent 8 }}
      ports: [{ port: 8789 }]
    - from: {{- include "selvedge.peer" (dict "root" . "component" "runner") | nindent 8 }}
    {{- include "selvedge.metricsIngress" . | nindent 4 }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: {{- include "selvedge.peer" (dict "root" . "component" "api") | nindent 8 }}
      # The API's internal endpoints: their own mTLS port when TLS is on.
      ports: [{ port: {{ if .Values.tls.enabled }}8786{{ else }}8787{{ end }} }]
    - to: {{- include "selvedge.peer" (dict "root" . "component" "data") | nindent 8 }}
      ports: [{ port: 8788 }]
    - to: {{- include "selvedge.peer" (dict "root" . "component" "runner") | nindent 8 }}
    {{- if .Values.objectStore.bundled }}
    - to: {{- include "selvedge.peer" (dict "root" . "component" "seaweedfs") | nindent 8 }}
      ports: [{ port: 8333 }]
    {{- end }}
    {{- with .Values.networkPolicy.extraRunnerEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml .Values.networkPolicy.privateCIDRs | nindent 14 }}
---
# The data service holds database credentials; only runners call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-data
  labels: {{- include "selvedge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "selvedge.selector" (dict "root" . "component" "data") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from: {{- include "selvedge.peer" (dict "root" . "component" "runner") | nindent 8 }}
      ports: [{ port: 8788 }]
    {{- if .Values.data.r2S3.enabled }}
    # R2's S3-compatible API is for clients anywhere; requests are signed.
    - ports: [{ port: 8790 }]
    {{- end }}
    {{- include "selvedge.metricsIngress" . | nindent 4 }}
{{- if .Values.postgres.bundled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-postgres
  labels: {{- include "selvedge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "selvedge.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "selvedge.peer" (dict "root" . "component" "api") | nindent 8 }}
        {{- include "selvedge.peer" (dict "root" . "component" "data") | nindent 8 }}
      ports: [{ port: 5432 }]
{{- end }}
{{- if .Values.objectStore.bundled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-seaweedfs
  labels: {{- include "selvedge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "selvedge.selector" (dict "root" . "component" "seaweedfs") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "selvedge.peer" (dict "root" . "component" "api") | nindent 8 }}
        {{- include "selvedge.peer" (dict "root" . "component" "data") | nindent 8 }}
        {{- include "selvedge.peer" (dict "root" . "component" "runner") | nindent 8 }}
        {{- include "selvedge.peer" (dict "root" . "component" "setup") | nindent 8 }}
      ports: [{ port: 8333 }]
{{- end }}
{{- end }}
