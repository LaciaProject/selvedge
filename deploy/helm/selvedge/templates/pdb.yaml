{{- if eq .Values.profile "ha" }}
{{- $components := list "api" "data" "gateway" "runner" }}
{{- if .Values.containers.enabled }}{{ $components = append $components "containers" }}{{ end }}
{{- range $component := $components }}
{{- $c := dict "root" $ "component" $component }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "selvedge.name" $ }}-{{ $component }}
  labels: {{- include "selvedge.labels" $ | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "selvedge.selector" $c | nindent 6 }}
{{- end }}
{{- end }}
