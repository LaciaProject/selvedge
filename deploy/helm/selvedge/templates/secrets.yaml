{{- $name := include "selvedge.name" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- /* Reuse generated values on upgrade, so secrets never rotate by accident. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" $name)) | default dict }}
{{- $data := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secrets
  labels: {{- include "selvedge.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  master-key: {{ .Values.secrets.masterKey | default (index $data "master-key" | default "" | b64dec) | default (randAlphaNum 48 | sha256sum) | b64enc }}
  internal-token: {{ .Values.secrets.internalToken | default (index $data "internal-token" | default "" | b64dec) | default (randAlphaNum 40) | b64enc }}
  admin-token: {{ .Values.secrets.adminToken | default (index $data "admin-token" | default "" | b64dec) | default (printf "slv_admin_%s" (randAlphaNum 32)) | b64enc }}
  cluster-secret: {{ .Values.secrets.clusterSecret | default (index $data "cluster-secret" | default "" | b64dec) | default (randAlphaNum 48) | b64enc }}
{{- end }}
---
{{- if and (not .Values.postgres.existingSecret) }}
{{- $url := .Values.postgres.url }}
{{- if and .Values.postgres.bundled (not $url) }}
{{- $existingDb := (lookup "v1" "Secret" .Release.Namespace (printf "%s-database" $name)) | default dict }}
{{- $pw := (index ($existingDb.data | default dict) "password" | default "" | b64dec) | default (randAlphaNum 32) }}
{{- $url = printf "postgres://selvedge:%s@%s-postgres:5432/selvedge" $pw $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-database
  labels: {{- include "selvedge.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  url: {{ $url | b64enc }}
  password: {{ $pw | b64enc }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-database
  labels: {{- include "selvedge.labels" . | nindent 4 }}
type: Opaque
data:
  url: {{ required "postgres.url is required when postgres.bundled is false" $url | b64enc }}
{{- end }}
{{- end }}
---
{{- if not .Values.objectStore.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-object-store
  labels: {{- include "selvedge.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.objectStore.bundled }}
  # The bundled SeaweedFS accepts any credentials; only Selvedge pods can reach it.
  access-key-id: {{ .Values.objectStore.accessKeyId | default "selvedge" | b64enc }}
  secret-access-key: {{ .Values.objectStore.secretAccessKey | default "selvedge" | b64enc }}
  {{- else }}
  access-key-id: {{ required "objectStore.accessKeyId is required" .Values.objectStore.accessKeyId | b64enc }}
  secret-access-key: {{ required "objectStore.secretAccessKey is required" .Values.objectStore.secretAccessKey | b64enc }}
  {{- end }}
{{- end }}
{{- if .Values.tls.enabled }}
---
{{- /* The platform CA, generated once and kept across upgrades. Only the
chart reads its key, to sign the components' certificates; no pod mounts it. */}}
{{- $caData := ((lookup "v1" "Secret" .Release.Namespace (printf "%s-tls-ca" $name)) | default dict).data | default dict }}
{{- $ca := dict }}
{{- if index $caData "tls.crt" }}
{{- $ca = buildCustomCert (index $caData "tls.crt") (index $caData "tls.key") }}
{{- else }}
{{- $ca = genCA "selvedge-platform-ca" 3650 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-tls-ca
  labels: {{- include "selvedge.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $ca.Cert | b64enc }}
  tls.key: {{ $ca.Key | b64enc }}
{{- /* One certificate per role, for <role>.selvedge.internal: peers check
the role, so a runner's certificate reaches only what a runner may call. */}}
{{- $roles := list "api" "data" "gateway" "runner" }}
{{- if .Values.containers.enabled }}{{ $roles = append $roles "containers" }}{{ end }}
{{- range $role := $roles }}
{{- $data := ((lookup "v1" "Secret" $.Release.Namespace (printf "%s-tls-%s" $name $role)) | default dict).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-tls-{{ $role }}
  labels: {{- include "selvedge.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  {{- if index $data "tls.crt" }}
  tls.crt: {{ index $data "tls.crt" }}
  tls.key: {{ index $data "tls.key" }}
  {{- else }}
  {{- $cert := genSignedCert $role nil (list (printf "%s.selvedge.internal" $role)) 3650 $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.containers.enabled (not .Values.containers.registry.tokenSecret) }}
---
{{- /* The key that signs registry tokens (ECDSA P-256) and a certificate
for it, which the registry trusts. Generated once and kept. */}}
{{- $tok := ((lookup "v1" "Secret" .Release.Namespace (include "selvedge.registryTokenSecret" .)) | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "selvedge.registryTokenSecret" . }}
  labels: {{- include "selvedge.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  {{- if index $tok "tls.crt" }}
  tls.crt: {{ index $tok "tls.crt" }}
  tls.key: {{ index $tok "tls.key" }}
  {{- else }}
  {{- $key := genPrivateKey "ecdsa" }}
  {{- $cert := genSelfSignedCertWithKey "selvedge registry tokens" nil nil 3650 $key }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $key | b64enc }}
  {{- end }}
{{- end }}
