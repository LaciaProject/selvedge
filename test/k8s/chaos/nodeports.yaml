# The API and the gateway at NodePorts, so the test reaches them at a node's
# address instead of through `kubectl port-forward` while faults run.
apiVersion: v1
kind: Service
metadata:
  name: slv-api-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: selvedge
    app.kubernetes.io/instance: slv
    app.kubernetes.io/component: api
  ports: [{ port: 8787, targetPort: http, nodePort: 30787 }]
---
apiVersion: v1
kind: Service
metadata:
  name: slv-gateway-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: selvedge
    app.kubernetes.io/instance: slv
    app.kubernetes.io/component: gateway
  ports: [{ port: 80, targetPort: http, nodePort: 30080 }]
