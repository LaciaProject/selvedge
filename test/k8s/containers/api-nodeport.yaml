# The API at a NodePort, so that the host and the node's containerd reach the
# registry's token endpoint at the same address.
apiVersion: v1
kind: Service
metadata:
  name: slv-api-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: selvedge
    app.kubernetes.io/instance: slv
    app.kubernetes.io/component: api
  ports: [{ port: 8787, targetPort: http, nodePort: 30787 }]
