# Values for the containers test on kind: one node, instances in Kata VMs,
# the bundled registry at localhost:30500 and the API's token endpoint at
# localhost:30787 (NodePorts mapped to the same ports on the host).
image: { repository: selvedge, tag: ci, pullPolicy: Never }
gateway: { service: { type: ClusterIP } }
runner:
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 1Gi } }
api: { resources: { requests: { cpu: 50m, memory: 64Mi } } }
data: { resources: { requests: { cpu: 50m, memory: 64Mi } } }
containers:
  enabled: true
  # The Go runtime: kind nodes have no D-Bus for runtime-rs's cgroups.
  runtimeClassName: kata-qemu
  accountInstances: 5
  registry:
    host: localhost:30500
    tokenRealm: http://localhost:30787/registry/token
    storage: 2Gi
    service: { type: NodePort, port: 5000, nodePort: 30500 }
