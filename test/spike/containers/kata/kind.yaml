kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Kata runs each pod in a VM.
    extraMounts:
      - hostPath: /dev/kvm
        containerPath: /dev/kvm
      # The runtime talks to the agent in the VM over vsock.
      - hostPath: /dev/vhost-vsock
        containerPath: /dev/vhost-vsock
      - hostPath: /dev/vhost-net
        containerPath: /dev/vhost-net
