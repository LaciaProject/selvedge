kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Kata runs each pod in a VM.
    extraMounts:
      - hostPath: /dev/kvm
        containerPath: /dev/kvm
      # The runtime talks to the agent in the VM over vsock.
      - hostPath: /dev/vhost-vsock
        containerPath: /dev/vhost-vsock
      - hostPath: /dev/vhost-net
        containerPath: /dev/vhost-net
      # Kata backs guest memory with a file in /dev/shm (shared for
      # virtio-fs); a node container's own /dev/shm is 64 MiB.
      - hostPath: /dev/shm
        containerPath: /dev/shm
